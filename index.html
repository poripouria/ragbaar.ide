<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RagbaarNet — Typing Channel</title>
<meta name="description" content="Turn your keystrokes, scrolling and mouse movement into a live orchestral performance, generated in real time by an LSTM model running entirely in your browser.">
<link rel="icon" type="image/svg+xml" href="assets/RagbaarLogo%20White.svg">
<link rel="alternate icon" type="image/png" href="assets/RagbaarLogo%20White.png">
<link rel="apple-touch-icon" href="assets/RagbaarLogo%20White.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="titlebar">
        <div class="titlebar-left">
            <div class="traffic-lights">
                <span class="red" id="redBtn" title="Close"></span>
                <span class="green" id="greenBtn" title="Save"></span>
            </div>
            <div class="titlebar-title">
                <strong>RagbaarNet</strong> —
                <input type="text" id="filenameInput" class="filename-input" value="session.js"
                    spellcheck="false" autocomplete="off" autocapitalize="off"
                    title="Click to rename (also picks the syntax highlighting)">
            </div>
        </div>
        <div class="status">
            <div class="volume-control">
                <span id="volumeLabel">70%</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="70">
            </div>
            <button class="icon-btn stop-btn" id="stopBtn" title="Start Music Engine">▶</button>
        </div>
    </div>

    <div class="editor-wrapper">
        <div class="gutter" id="gutter"><div>1</div></div>
        <div class="code-area">
            <pre id="highlightPre" class="highlight-pre" aria-hidden="true"><code id="highlightCode" class="language-javascript"></code></pre>
            <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
                placeholder=
"// Start typing and enjoy your performance! Each key press sends a NOTE_ON/NOTE_OFF to the processor.

function RagbaarNet(scene) {
    return generateMusic(scene);
}"
            ></textarea>
        </div>
    </div>

    <div class="statusbar">
        <div class="statusbar-group">
            <span>Last key: <strong id="lastKey">—</strong></span>
            <span class="note-count">Notes sent: <strong id="noteCount">0</strong></span>
            <span class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting…</span>
            </span>
        </div>
        <div class="held-keys" id="heldKeys"></div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script src="js/core.js"></script>
<script src="js/audio-engine.js"></script>
<script src="js/config.js"></script>
<script src="js/lstm-inference.js"></script>
<script src="js/typing-detector.js"></script>
<script src="js/lstm-orchestral-musician.js"></script>
<script src="js/main.js"></script>

</body>
</html>
