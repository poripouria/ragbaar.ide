<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
    <script src="js/lstm-inference.js"></script>
</head>
<body>
    <h2>Model Test</h2>
    <button onclick="runTest()">Generate 5 notes</button>
    <pre id="output" style="white-space: pre-wrap;"></pre>

    <script>
        const engine = new LSTMOrchestralEngine();
        let loadPromise = engine.load().catch(err => {
            document.getElementById('output').textContent = "LOAD ERROR:\n" + err.stack;
        });

        async function runTest() {
            const output = document.getElementById('output');
            output.textContent = "Waiting for model to finish loading...";

            try {
                await loadPromise; // make sure load() actually finished before generating

                output.textContent = "Generating...";

                let seed = ["60", "62", "64"];
                let generated = [];

                for (let i = 0; i < 5; i++) {
                    const note = await engine.nextNote(seed);
                    generated.push(note);
                    seed.push(note);
                }

                output.textContent = "Generated notes: " + generated.join(", ");
            } catch (err) {
                output.textContent = "RUNTIME ERROR:\n" + err.stack;
            }
        }
    </script>
</body>
</html>
